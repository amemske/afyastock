services:
  db:
    image: pgvector/pgvector:pg16
    container_name: afyastock-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afyastock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afyastock}
      POSTGRES_DB: ${POSTGRES_DB:-afyastock}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afyastock}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
